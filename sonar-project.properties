# Configuracion del analisis estatico de envios-service
# Nota: al ejecutar "mvn sonar:sonar", el scanner de Maven toma estas mismas
# propiedades del pom.xml; este archivo documenta la configuracion y sirve
# para ejecutar el analisis con sonar-scanner CLI.

# Identificador unico del proyecto en SonarQube
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Fuentes y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Reporte de cobertura JaCoCo (generado por mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusiones: no se excluye ninguna clase (ver Decision de diseno 2 del README)
# sonar.exclusions=

# Servidor SonarQube local (Docker, ver Decision de diseno 1)
sonar.host.url=http://localhost:9000
# No bloquear el build esperando el resultado del Quality Gate
sonar.qualitygate.wait=false
